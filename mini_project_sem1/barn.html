<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Barn Monitoring System</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f7fb;
      color: #333;
    }

    header {
      background: #1f3c88;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card h3 {
      margin-bottom: 10px;
      color: #1f3c88;
      font-size: 18px;
    }

    .value {
      font-size: 30px;
      font-weight: bold;
    }

    .status-card {
      grid-column: span 2;
    }

    .status {
      margin-top: 15px;
      padding: 18px;
      font-size: 28px;
      font-weight: bold;
      border-radius: 10px;
      animation: pulse 1.5s infinite;
    }

    .safe {
      background: #d4edda;
      color: #155724;
      animation: none;
    }

    .warning {
      background: #fff3cd;
      color: #856404;
    }

    .danger {
      background: #f8d7da;
      color: #721c24;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    footer {
      text-align: center;
      font-size: 13px;
      color: #666;
      padding: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>🐄 Smart Barn Monitoring System</h1>
  <p>Automatic real-time monitoring with ML-based alerts</p>
</header>

<div class="container">

  <div class="card">
    <h3>🌡 Temperature</h3>
    <div class="value" id="temp">-- °C</div>
  </div>

  <div class="card">
    <h3>💧 Humidity</h3>
    <div class="value" id="hum">-- %</div>
  </div>

  <div class="card">
    <h3>🌫 Air Quality (Gas)</h3>
    <div class="value" id="gas">-- ppm</div>
  </div>

  <div class="card status-card">
    <h3>Overall Barn Status</h3>
    <div id="status" class="status safe">SAFE</div>
  </div>

</div>

<footer>
  Auto-updating prototype • Simulated sensor data • Smart Agriculture Mini Project
</footer>

<script>
  function autoMonitor() {
    // Auto sensor data (simulated)
    let temp = Math.floor(Math.random() * 25) + 20;
    let hum  = Math.floor(Math.random() * 60) + 30;
    let gas  = Math.floor(Math.random() * 400) + 100;

    document.getElementById("temp").innerText = temp + " °C";
    document.getElementById("hum").innerText  = hum + " %";
    document.getElementById("gas").innerText  = gas + " ppm";

    let status = document.getElementById("status");

    // ML-style classification logic
    if (temp > 35 || hum > 80 || gas > 300) {
      status.innerText = "DANGER 🚨";
      status.className = "status danger";
    }
    else if (temp > 30 || gas > 200) {
      status.innerText = "WARNING ⚠";
      status.className = "status warning";
    }
    else {
      status.innerText = "SAFE ✅";
      status.className = "status safe";
    }
  }

  // AUTO START + AUTO UPDATE
  autoMonitor();
  setInterval(autoMonitor, 3000);
</script>

</body>
</html>
